name: docs
on:
  push:
    paths: ["docs/**", "web/**", "zensical.toml", "build_site.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "web/**", "zensical.toml", "build_site.py", ".github/workflows/docs.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install zensical==0.0.63
      - run: python build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site
