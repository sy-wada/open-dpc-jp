[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "open-dpc-jp"
version = "0.1.0"
description = "DPC FF1/EF readers, versioned schemas, and research algorithms for Japan"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/sy-wada/open-dpc-jp"
Documentation = "https://open-dpc-jp.pages.dev/"
Repository = "https://github.com/sy-wada/open-dpc-jp"
Issues = "https://github.com/sy-wada/open-dpc-jp/issues"

[dependency-groups]
docs = ["zensical==0.0.63"]
release = ["build==1.3.0", "twine==6.2.0"]

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "**/*.pyc", "site", "dist", "web/*.test.mjs"]
include = ["src", "spec", "conformance", "tests", "tools", "extraction", "docs", "web", "build_site.py", "zensical.toml", "README.md", "README_ja.md", "CHANGELOG.md", "MIRAI-ID-CCI-PROVENANCE.md", "NOTICE.md", "CITATION.cff", "LICENSE", "RELEASE-CHECKLIST.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_dpc", "src/open_dpc_jp"]
